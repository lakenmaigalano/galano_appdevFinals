<div style="text-align:center; margin-top:20px;">
<h1>{{ title() }}</h1>
<!-- Add Student Area-->
<input type="text" [value]="studentName()"
(input)="studentName.set($any($event.target).value)" placeholder="Name">
<input type="text" [value]="studentCourse()"
(input)="studentCourse.set($any($event.target).value)" placeholder="Course">
<input type="text" [value]="studentEmail()"
(input)="studentEmail.set($any($event.target).value)" placeholder="Email">
<input type="text" [value]="studentUsername()"
(input)="studentUsername.set($any($event.target).value)" placeholder="Username">
<input type="text" [value]="studentPassword()"
(input)="studentPassword.set($any($event.target).value)" placeholder="Password">
<button (click)="addStudent()">Add Student</button>
<hr>
<!-- List Students Area-->
<div *ngFor="let student of students" style="margin-bottom:10px;">
<input [value]="student.name" (input)="student.name = $any($event.target).value">
<input [value]="student.course" (input)="student.course = $any($event.target).value">
<input [value]="student.email" (input)="student.email = $any($event.target).value">
<input [value]="student.username" (input)="student.username = $any($event.target).value">
<input [value]="student.password" (input)="student.password = $any($event.target).value">
<button (click)="updateStudent(student.id, student.name,student.course, student.email, student.username, student.password)">Update</button>
<button (click)="deleteStudent(student.id)">Delete</button>
</div>
</div>
